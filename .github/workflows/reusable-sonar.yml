permissions:
  contents: read
name: Reusable SonarCloud Analysis

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        required: true
        type: string
      organization:
        description: 'SonarCloud organization'
        required: true
        type: string
      additional-args:
        description: 'Additional SonarCloud arguments'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for the analysis'
        required: false
        type: string
        default: '.'
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            ${{ inputs.additional-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}