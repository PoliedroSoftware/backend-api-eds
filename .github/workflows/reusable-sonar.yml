name: Reusable SonarCloud Analysis

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        required: true
        type: string
      organization:
        description: 'SonarCloud organization'
        required: true
        type: string
      additional-args:
        description: 'Additional SonarCloud arguments'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for the analysis'
        required: false
        type: string
        default: '.'
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
          
      - name: Install SonarCloud scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ inputs.project-key }}" \
            /o:"${{ inputs.organization }}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/*.Tests/**" \
            ${{ inputs.additional-args }}
          
          dotnet build --no-restore
          
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"