name: Build, Test, Deploy to ECS

on:
  push:
    branches:
      - feature/test-checklist
  
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - 'release/*'
      - 'releasecandidate/*'

concurrency:
  # Enhanced concurrency control for cost optimization
  group: >-
    ${{ github.workflow }}-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Cancel redundant workflows when merging to releasecandidate branches
  cancel-redundant-workflows:
    if: >
      github.event_name == 'pull_request' && 
      (github.event.action == 'closed' || github.event.action == 'synchronize') &&
      (startsWith(github.event.pull_request.base.ref, 'releasecandidate/') || 
       contains(github.event.pull_request.base.ref, 'release/'))
    uses: ./.github/workflows/reusable-cancel-workflows.yml
    with:
      target-branch: ${{ github.event.pull_request.head.ref }}
      skip-current: true
      max-age-minutes: 2
      workflow-names: 'Build, Test, Deploy to ECS'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Build and test .NET application
  dotnet:
    # Skip expensive build operations if this is a closed/merged PR to save costs
    if: >
      github.event_name != 'pull_request' || 
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-dotnet-build.yml
    with:
      dotnet-version: '8.0.x'
      configuration: 'Release'
      solution-path: 'Poliedro.EDS.sln'
      run-tests: true
      cache-key-suffix: ${{ github.sha }}

  # Run SonarCloud analysis
  sonar:
    # Only run SonarCloud analysis for merged PRs or main branch pushes
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releasecandidate/')))
    needs: dotnet
    uses: ./.github/workflows/reusable-sonar.yml
    with:
      project-key: 'PoliedroSoftware_backend-api-eds'
      organization: 'poliedro-software-sonarqube'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Run JMeter load tests (optional, can be enabled when needed)
  jmeter:
    if: false # Disabled for now - enable when needed
    needs: dotnet
    uses: ./.github/workflows/reusable-jmeter.yml
    with:
      test-plan-path: 'LoadTest/EDS.jmx'
      results-path: 'LoadTest/results'
      generate-html-report: true
      fail-on-error: true

  # Build and push Docker images
  docker:
    if: github.event.pull_request.merged == true
    needs: [dotnet, sonar]
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image-name: ${{ vars.DOCKERHUB_REPOSITORY_EDS || 'backend-api-eds' }}
      image-tag: 'latest'
      registry-type: 'both'  # Push to both ECR and Docker Hub
      aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_EDS }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}               

  # Deploy to multiple environments using matrix strategy
  deploy:
    if: github.event.pull_request.merged == true
    needs: docker
    strategy:
      matrix:
        environment: [dev, qa]
        include:
          - environment: dev
            service_secret: AWS_ECS_SERVICE
            task_definition_secret: TASK_DEFINITION_ARN
          - environment: qa
            service_secret: AWS_ECS_SERVICE_EDS_QA
            task_definition_secret: TASK_DEFINITION_ARN_EDS_QA
    uses: ./.github/workflows/reusable-aws-deploy.yml
    with:
      environment: ${{ matrix.environment }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      wait-for-deployment: true
      deployment-timeout: '10'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ secrets[matrix.service_secret] }}
      TASK_DEFINITION_ARN: ${{ secrets[matrix.task_definition_secret] }}        